[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.coverage.run]
branch = true
omit = ["TESTS/*"]
source = ["scripts"]

[tool.mypy]
mypy_path = "."
python_version = "3.13"
strict = true

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]
testpaths = ["TESTS"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.format]
line-ending = "lf"
quote-style = "double"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]
