# Reproducible developer and CI environment for the standalone Universe repo.
[workspace]
name = "universe"
version = "0.1.0"
description = "Self-hosted universes of software, data, models, and skills, with sealed offline delivery"
authors = ["Archont561 <142521648+Archont561@users.noreply.github.com>"]
homepage = "https://github.com/Archont561/universe"
repository = "https://github.com/Archont561/universe"
channels = ["conda-forge"]
platforms = ["linux-64"]
requires-pixi = ">=0.83.0"

[workspace.dependencies]
actionlint = ">=1.7.12,<2"
bun = ">=1.4.2,<2"
c-compiler = "*"
cargo-audit = ">=0.22.1,<0.23"
cargo-deny = ">=0.20.2,<0.21"
cargo-llvm-cov = ">=0.9.1,<0.10"
cargo-nextest = ">=0.9.149,<0.10"
convco = ">=0.7.2,<0.8"
cxx-compiler = "*"
lefthook = ">=2.2.2,<3"
llvm-tools = "*"
mypy = ">=1.15,<2"
pkg-config = "*"
pytest = ">=8.0,<10"
pytest-cov = ">=6.0,<8"
python = ">=3.13,<3.14"
ruff = ">=0.11,<1"
rust = ">=1.99.0,<2"
rattler-build = ">=0.77.0,<0.78"
# `actionlint` shells out to `shellcheck` when it finds one, and `ubuntu-latest`
# ships it while this environment did not. An uninstalled checker therefore turned
# `pixi run lint-actions` into a weaker gate than CI: workflows whose `run:` blocks
# only fail shellcheck passed locally and failed on the runner. Pinning it here makes
# the local task and the CI task lint the same surface.
shellcheck = "*"
taplo = ">=0.10.0,<0.11"

[feature.dev.dependencies]
actionlint = { workspace = true }
bun = { workspace = true }
c-compiler = { workspace = true }
cargo-audit = { workspace = true }
cargo-deny = { workspace = true }
cargo-llvm-cov = { workspace = true }
cargo-nextest = { workspace = true }
convco = { workspace = true }
cxx-compiler = { workspace = true }
lefthook = { workspace = true }
llvm-tools = { workspace = true }
mypy = { workspace = true }
pkg-config = { workspace = true }
pytest = { workspace = true }
pytest-cov = { workspace = true }
python = { workspace = true }
ruff = { workspace = true }
rust = { workspace = true }
shellcheck = { workspace = true }
taplo = { workspace = true }

[feature.dev.pypi-dependencies]
# Static repository linter; the wheel embeds the binary, so no toolchain is needed.
# Decision-121 owns what .alint.yml checks and what stays in scripts/.
alint = "==0.20.1"
# Builds the PyPI wheels for the Universe CLIs from the same crates Conda packages.
# Pinned to the release verified on PyPI; the wheel ships the binary, so no extra
# toolchain is needed. The packaging task and per-crate pyproject.toml land with
# the distribution slice, not here.
maturin = "==1.16.0"

[feature.dev.activation.env]
LLVM_COV = "$CONDA_PREFIX/bin/llvm-cov"
LLVM_PROFDATA = "$CONDA_PREFIX/bin/llvm-profdata"

[feature.packaging.dependencies]
rattler-build = { workspace = true }

[environments]
default = { features = ["dev"], solve-group = "default" }
packaging = { features = ["dev", "packaging"], solve-group = "default" }

[tasks]
web-install = { cmd = "bun install --frozen-lockfile", description = "Install the locked Bun workspace" }
web-check = { cmd = "bun run all:check", depends-on = [
  "web-install",
], description = "Run Bun workspace formatting, lint, type, and unit checks" }
web-build = { cmd = "bun run all:build", depends-on = [
  "web-install",
], description = "Build Bun workspace packages" }
hooks-install = { cmd = "lefthook install", description = "Install Git hooks" }
setup = { depends-on = [
  "hooks-install",
], description = "Materialise the Pixi environment and Git hooks" }

fmt = { cmd = "cargo fmt --all && taplo fmt && ruff format scripts TESTS && ruff check --fix scripts TESTS", description = "Format Rust, TOML, and Python files" }
fmt-check = { cmd = "cargo fmt --all --check && taplo fmt --check && ruff format --check scripts TESTS", description = "Verify Rust, TOML, and Python formatting" }
lint = { cmd = "cargo clippy --workspace --all-targets --all-features --locked -- -D warnings && ruff check scripts TESTS", description = "Lint Rust and Python files" }
typecheck = { cmd = "cargo check --workspace --all-targets --all-features --locked && mypy scripts TESTS", description = "Type-check Rust and Python" }
test = { cmd = "cargo nextest run --workspace --all-features --locked && cargo test --workspace --locked --doc && pytest", description = "Run Rust unit/integration/doc tests and Python script tests" }
build = { cmd = "cargo build --workspace --all-features --locked", description = "Build every Universe crate and binary" }
package-kit = { cmd = "rattler-build build --recipe crates/universe-kit/recipe/recipe.yaml --variant-config crates/universe-kit/recipe/variants.yaml --output-dir output/universe-kit -c conda-forge", description = "Build the universe-kit Conda package (use the packaging environment)" }
package-airlock = { cmd = "rattler-build build --recipe crates/universe-airlock/recipe/recipe.yaml --variant-config crates/universe-airlock/recipe/variants.yaml --output-dir output/universe-airlock -c conda-forge", description = "Build the universe-airlock Conda package (use the packaging environment)" }
package-airlock-bootstrap = { cmd = "rattler-build build --recipe crates/universe-airlock-bootstrap/recipe/recipe.yaml --variant-config crates/universe-airlock-bootstrap/recipe/variants.yaml --output-dir output/universe-airlock-bootstrap -c conda-forge", description = "Build the universe-airlock-bootstrap Conda package (use the packaging environment)" }
coverage = { cmd = "mkdir -p target/coverage/python && cargo llvm-cov --workspace --all-features --locked --fail-under-lines 90 --lcov --output-path target/coverage/lcov.info && pytest --cov=scripts --cov-fail-under=80 --cov-report=lcov:target/coverage/python/lcov.info --cov-report=term-missing", description = "Generate Rust and Python LCOV coverage and enforce line thresholds" }

backlog-check = { cmd = "python -m scripts.backlog_check", description = "Validate Backlog identity, statuses, and cross-record references" }
repo-check = { cmd = "python -m scripts.repo_check", description = "Validate the invariants a declarative config cannot express: tokens, version parity, transport, audit gate" }
sandbox-publish-logs = { cmd = "python -m scripts.print_sandbox_logs \"$RUNNER_TEMP/pixi-sandbox-logs\"", description = "Print bounded pixi-sandbox publishing diagnostics in CI annotations" }
skills-check = { cmd = "python -m scripts.skills_check", description = "Validate agent-skill frontmatter and content hashes" }
skills-check-write = { cmd = "python -m scripts.skills_check --write", description = "Refresh agent-skill content hashes after a deliberate skill edit" }
lint-actions = { cmd = "actionlint .github/workflows/*.yml", description = "Lint GitHub Actions workflows" }
lint-commit = { cmd = "convco check --config .config/convco.yml --from-stdin", description = "Validate one conventional commit message" }
lint-commits = { cmd = "convco check --config .config/convco.yml", description = "Validate a conventional commit range" }
audit = { cmd = "python -m scripts.audit check", description = "Audit locked Rust dependencies and supply-chain policy offline when the advisory cache exists" }
audit-sync = { cmd = "python -m scripts.audit sync", description = "Refresh the RustSec advisory and crates.io index caches (needs network)" }
alint-check = { cmd = "alint check", description = "Validate repository structure, naming, and cross-file rules from .alint.yml" }
crate-check = { cmd = "python -m scripts.crate_check", description = "Validate that universe-core depends on nothing ecosystem, UI, or network related" }

check = { depends-on = [
  "fmt-check",
  "lint",
  "typecheck",
  "test",
  "backlog-check",
  "repo-check",
  "skills-check",
  "alint-check",
  "crate-check",
], description = "Run format, lint, type, test, backlog, repository, skill, and crate-boundary checks" }
offline-gates = { depends-on = [
  "check",
  "coverage",
  "lint-actions",
  "build",
], description = "Run offline-compatible Rust, Python, and repository gates; excludes Bun installs and advisory database updates" }
gates = { depends-on = [
  "check",
  "web-check",
  "coverage",
  "lint-actions",
  "audit",
  "build",
], description = "Every required local quality gate" }
ci = { depends-on = ["gates"], description = "Run the complete CI gate suite locally" }
