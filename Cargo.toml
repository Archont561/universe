[workspace]
resolver = "3"
members = [
  "crates/universe-cli",
  "crates/universe-airlock",
  "crates/universe-airlock-bootstrap",
  "crates/universe-core",
  "crates/universe-assets",
  "crates/universe-conda",
  "crates/universe-kit",
  "crates/universe-workflow",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99.0"
authors = ["Archont561 <142521648+Archont561@users.noreply.github.com>"]
license = "MIT"
homepage = "https://github.com/Archont561/universe"
repository = "https://github.com/Archont561/universe"
publish = false

[workspace.dependencies]
universe-core = { path = "crates/universe-core", version = "=0.1.0" }
universe-conda = { path = "crates/universe-conda", version = "=0.1.0" }
universe-assets = { path = "crates/universe-assets", version = "=0.1.0" }
universe-workflow = { path = "crates/universe-workflow", version = "=0.1.0" }
assert_cmd = "2.0"
goblin = "0.10"
include_dir = "0.7.4"
minijinja = { version = "3", features = ["serde"] }
predicates = "3.1"
proptest = "1.12"
rattler_digest = { version = "2.1", default-features = false }
rattler_package_streaming = { version = "0.28", default-features = false }
rstest = "0.27"
rstest-bdd = "=0.6.0"
rstest-bdd-macros = { version = "=0.6.0", features = ["strict-compile-time-validation"] }
rstest-reuse = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
spdx = "0.13"
serde_yaml = "0.9"
rattler_conda_types = { version = "0.58", default-features = false }
tar = "0.4"
tempfile = "3.19"
thiserror = "2.0"
toml_edit = { version = "0.25", default-features = false, features = ["parse"] }
wiremock = "0.6"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

[profile.dev]
debug = "line-tables-only"

[profile.release]
debug = "line-tables-only"
strip = "symbols"
