# Explicit Convco 0.7.x policy. Both lint tasks pass this path explicitly.
#
# Scope: validating commit messages, and drafting changelog sections when asked. The
# `header:` block was removed deliberately (`decision-123`): it declared a changelog preamble,
# which reads as "this file generates CHANGELOG.md". Nothing does — the changelog is curated
# by hand and only checked, so the preamble had no owner and no effect.

types:
  - type: feat
    section: Features
    hidden: false
  - type: fix
    section: Bug Fixes
    hidden: false
  - type: perf
    section: Performance
    hidden: false
  - type: refactor
    section: Refactoring
    hidden: true
  - type: docs
    section: Documentation
    hidden: true
  - type: test
    section: Testing
    hidden: true
  - type: build
    section: Build System
    hidden: true
  - type: ci
    section: Continuous Integration
    hidden: true
  - type: chore
    section: Miscellaneous
    hidden: true

issuePrefixes: ["#"]
host: https://github.com
owner: Archont561
repository: universe
# Anchor both ends so malformed scopes cannot pass through a valid substring.
scopeRegex: "^[[:alnum:]]+(?:[-_/][[:alnum:]]+)*$"
lineLength: 100
wrapDisabled: false
linkCompare: true
linkReferences: true
merges: false
firstParent: false
