test_version: 1
name: a documentation tree with no .vale.ini is flagged
tags: [check, vale, prose, structure, failing]

# `lint-prose` shells out to Vale, which reads `.vale.ini` from the directory it runs in. With
# the file gone, Vale still exits zero — it simply applies no styles — so the gate would report
# a clean corpus it never linted.
docs:
  title: prose linting needs a configuration to lint with
  case: fail
  kind: file_exists

given:
  tree:
    README.md: "# hi\n"
    docs:
      AIRLOCK.md: "# airlock\n"
  config: |
    version: 1
    rules:
      - id: vale-configuration-present
        kind: file_exists
        paths: ".vale.ini"
        message: "prose linting needs `.vale.ini`, which names the styles and the vocabulary"
        level: error

when: [check]

expect:
  - exit: policy_failure
    violations:
      - {rule: vale-configuration-present, level: error}
