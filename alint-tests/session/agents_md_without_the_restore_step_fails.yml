test_version: 1
name: an AGENTS.md that drops the restore step is refused
tags: [check, agents, session, structure, failing]

docs:
  title: the rule survives only while all three commands are in the file
  case: fail
  kind: file_content_matches

given:
  tree:
    # The `pixi run setup` step is present and the restore is gone, which is the edit this
    # repository has to catch: an agent told to install hooks but not told what to do when
    # Pixi is missing reports an environment blocker and stops.
    AGENTS.md: |
      14. **A session starts with the environment, not with the Backlog.**

          ```bash
          command -v pixi >/dev/null
          pixi run setup
          ```
  config: |
    version: 1
    rules:
      - id: agents-md-names-the-restore-script
        kind: file_content_matches
        paths: "AGENTS.md"
        pattern: "bash scripts/restore\\.sh"
        level: error

when: [check]

expect:
  - exit: policy_failure
    violations:
      - {rule: agents-md-names-the-restore-script, level: error}
