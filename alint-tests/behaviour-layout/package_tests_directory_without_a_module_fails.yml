test_version: 1
name: a package tests directory with no module is flagged
tags: [check, package_tests, structure, failing]

# A package's behaviour is only covered if something runs. `tests/` holding fixtures but no
# test module is a suite that never executes.
docs:
  title: a package tests/ holds at least one test module
  case: fail
  kind: dir_contains

given:
  tree:
    packages:
      bar:
        package.json: '{"name": "bar"}'
        tests:
          fixtures:
            payload.json: "{}\n"
  config: |
    version: 1
    rules:
      - id: package-tests-directory-holds-tests
        kind: dir_contains
        select: "packages/*/tests"
        require: ["*.ts"]
        message: "tests/ must hold at least one test module"
        level: error

when: [check]

expect:
  - exit: policy_failure
    violations:
      - {rule: package-tests-directory-holds-tests, level: error, path: packages/bar/tests}
