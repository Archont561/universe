test_version: 1
name: workspace-unit-layout passes when a unit has src, tests and features
tags: [check, workspace_unit_layout, structure, passing]

docs:
  title: A workspace unit states its behaviour beside its code
  case: pass
  kind: for_each_dir

given:
  tree:
    crates:
      foo:
        Cargo.toml: "[package]\nname = \"foo\"\n"
        src:
          lib.rs: "pub fn a() {}\n"
        tests:
          behaviour.rs: "// binds the steps\n"
        features:
          foo.feature: "Feature: foo\n"
        README.md: "# foo\n"
    packages:
      bar:
        package.json: '{"name": "bar"}'
        src:
          index.ts: "export const a = 1;\n"
        tests:
          a.test.ts: "// a test\n"
        features:
          bar.feature: "Feature: bar\n"
  config: |
    version: 1
    rules:
      - id: workspace-unit-layout
        kind: for_each_dir
        select: ["crates/*", "packages/*"]
        when_iter: 'iter.has_file("Cargo.toml") or iter.has_file("package.json")'
        require:
          - kind: dir_exists
            paths: "{path}/src"
          - kind: dir_exists
            paths: "{path}/tests"
          - kind: dir_exists
            paths: "{path}/features"
        level: error

when: [check]

expect:
  - exit: success
    violations: []
