test_version: 1
name: workspace-unit-layout flags a unit with no features directory
tags: [check, workspace_unit_layout, structure, failing]

docs:
  title: A workspace unit states its behaviour beside its code
  case: fail
  kind: for_each_dir

given:
  tree:
    crates:
      foo:
        Cargo.toml: "[package]\nname = \"foo\"\n"
        src:
          lib.rs: "pub fn a() {}\n"
        tests:
          behaviour.rs: "// binds the steps\n"
  config: |
    version: 1
    rules:
      - id: workspace-unit-layout
        kind: for_each_dir
        select: ["crates/*", "packages/*"]
        when_iter: 'iter.has_file("Cargo.toml") or iter.has_file("package.json")'
        require:
          - kind: dir_exists
            paths: "{path}/src"
          - kind: dir_exists
            paths: "{path}/tests"
          - kind: dir_exists
            paths: "{path}/features"
        level: error

when: [check]

expect:
  - exit: policy_failure
    violations:
      - {rule: workspace-unit-layout, level: error, path: crates/foo}
