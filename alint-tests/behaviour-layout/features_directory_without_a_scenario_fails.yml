test_version: 1
name: a features directory with no .feature document is flagged
tags: [check, features_directory, structure, failing]

# An empty `features/` satisfies the layout rule and specifies nothing. The documents are
# what make the directory a specification rather than a placeholder.
docs:
  title: features/ holds at least one scenario document
  case: fail
  kind: dir_contains

given:
  tree:
    crates:
      foo:
        features:
          notes.md: "no scenario here\n"
  config: |
    version: 1
    rules:
      - id: features-directory-holds-scenarios
        kind: dir_contains
        select: "{crates,packages}/*/features"
        require: ["*.feature"]
        message: "features/ must hold at least one .feature document"
        level: error

when: [check]

expect:
  - exit: policy_failure
    violations:
      - {rule: features-directory-holds-scenarios, level: error, path: crates/foo/features}
