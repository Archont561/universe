test_version: 1
name: a crate manifest that declares its own version fails
tags: [check, version, structure, failing]

# `universe-assets` shipped this way: `env!` in the entrypoint would still be right, but
# `CARGO_PKG_VERSION` would then be that crate's own literal, and a release bump would have
# to find it. Inheritance is the half of the chain that makes the root manifest the only
# place a version is written.
docs:
  title: Only the root manifest declares the version
  case: fail
  kind: toml_path_equals

given:
  tree:
    Cargo.toml: |
      [workspace.package]
      version = "0.1.0"
    crates:
      foo:
        Cargo.toml: |
          [package]
          name = "foo"
          version = "0.1.0"
        src:
          lib.rs: |
            pub const VERSION: &str = env!("CARGO_PKG_VERSION");
  config: |
    version: 1
    rules:
      - id: crate-manifests-inherit-the-workspace-version
        kind: toml_path_equals
        paths: "crates/*/Cargo.toml"
        path: "$.package.version.workspace"
        equals: true
        level: error

when: [check]

expect:
  - exit: policy_failure
    violations:
      - {rule: crate-manifests-inherit-the-workspace-version, level: error, path: crates/foo/Cargo.toml}
