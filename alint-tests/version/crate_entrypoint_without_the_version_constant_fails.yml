test_version: 1
name: a crate entrypoint that spells its own version fails
tags: [check, version, content, failing]

# A literal in the entrypoint compiles, ships, and answers `--version` correctly — right up
# until the workspace version moves. The rule asks for the manifest-derived form, so the
# crate that skipped the release bump is the one that cannot be built.
docs:
  title: A crate learns its version from its own manifest
  case: fail
  kind: every_matching_has

given:
  tree:
    crates:
      foo:
        Cargo.toml: |
          [package]
          name = "foo"
          version.workspace = true
        src:
          lib.rs: |
            pub const VERSION: &str = "0.1.0";
  config: |
    version: 1
    rules:
      - id: crate-entrypoint-reads-its-manifest-version
        kind: every_matching_has
        select: "crates/*"
        when_iter: 'iter.has_file("Cargo.toml")'
        require:
          - kind: file_content_matches
            paths: "{path}/src/lib.rs"
            pattern: 'pub const VERSION: &str = env!\("CARGO_PKG_VERSION"\);'
        level: error

when: [check]

expect:
  - exit: policy_failure
    violations:
      - {rule: crate-entrypoint-reads-its-manifest-version, level: error, path: crates/foo/src/lib.rs}
