# alint — declarative repository shape, structure, and cross-file checks.
#
# This file is the authoritative declarative layer for repository shape:
# required/forbidden paths, naming, structured-config assertions, and cross-file
# relations. `scripts/repo_check.py` no longer duplicates it. What stays in
# Python is what cannot be expressed here — a token scan that must not match its
# own config, version inheritance through a Cargo workspace, and set/graph
# reasoning over the offline-transport contract. decision-121 records the split.
#
# Run with `pixi run alint-check`. Rule ids are stable; retire a rule by
# redeclaring it with `level: off` and saying why.

version: 1

templates:
  - id: universe-required-file
    kind: file_exists
    paths: ["{{vars.path}}"]
    level: error
    message: "Required repository file is missing: {{vars.path}}"

extends:
  # Always-on hygiene; every ecosystem ruleset below is a no-op off-ecosystem.
  - alint://bundled/oss-baseline@v1
  - alint://bundled/rust@v1
  - alint://bundled/node@v1
  - alint://bundled/monorepo@v1
  - alint://bundled/monorepo/cargo-workspace@v1
  - alint://bundled/ci/github-actions@v1
  - alint://bundled/agent-context@v1

rules:
  # --- Bundled rules that do not fit this repository ------------------------
  # The repository map lives in README.md and backlog/; it deliberately keeps
  # crates and packages free of per-directory READMEs.
  - id: monorepo-packages-have-readme
    level: off
  - id: cargo-workspace-member-has-readme
    level: off
  # Policy/community files are maintainer decisions, not lint findings, and the
  # scaffold has none of them by design.
  - id: oss-code-of-conduct-exists
    level: off
  - id: oss-codeowners-exists
    level: off
  - id: oss-security-policy-exists
    level: off
  - id: oss-security-policy-non-empty
    level: off
  - id: oss-dependency-update-tool
    level: off
  # The toolchain is pinned by pixi.lock and the Pixi manifest, not by a
  # rust-toolchain file or a Node engines field.
  - id: rust-toolchain-pinned
    level: off
  - id: node-engine-or-nvmrc
    level: off

  # The bundled `ci/github-actions` ruleset ships action pinning at `warning`;
  # a mutable CI ref is a hard failure here, so it is redeclared at `error`.
  - id: gha-pin-actions-to-sha
    level: error

  # --- Repository shape (now the authoritative declarative layer) ----------
  # `paths:` on an existence rule is a disjunction, so "all of these files are
  # required" is one instance per file, generated from a template.
  - extends_template: universe-required-file
    id: universe-required-devcontainer
    vars: { path: .devcontainer/devcontainer.json }
  - extends_template: universe-required-file
    id: universe-required-alint-config
    vars: { path: .alint.yml }
  - extends_template: universe-required-file
    id: universe-required-ci-workflow
    vars: { path: .github/workflows/ci.yml }
  - extends_template: universe-required-file
    id: universe-required-agents-md
    vars: { path: AGENTS.md }
  - extends_template: universe-required-file
    id: universe-required-changelog
    vars: { path: CHANGELOG.md }
  - extends_template: universe-required-file
    id: universe-required-contributing
    vars: { path: CONTRIBUTING.md }
  - extends_template: universe-required-file
    id: universe-required-cargo-manifest
    vars: { path: Cargo.toml }
  - extends_template: universe-required-file
    id: universe-required-license
    vars: { path: LICENSE }
  - extends_template: universe-required-file
    id: universe-required-readme
    vars: { path: README.md }
  - extends_template: universe-required-file
    id: universe-required-backlog-config
    vars: { path: backlog/config.yml }
  - extends_template: universe-required-file
    id: universe-required-airlock-recipe
    vars: { path: crates/universe-airlock/recipe/recipe.yaml }
  - extends_template: universe-required-file
    id: universe-required-airlock-variants
    vars: { path: crates/universe-airlock/recipe/variants.yaml }
  - extends_template: universe-required-file
    id: universe-required-kit-recipe
    vars: { path: crates/universe-kit/recipe/recipe.yaml }
  - extends_template: universe-required-file
    id: universe-required-kit-variants
    vars: { path: crates/universe-kit/recipe/variants.yaml }
  - extends_template: universe-required-file
    id: universe-required-cli-recipe
    vars: { path: crates/universe-cli/recipe/recipe.yaml }
  - extends_template: universe-required-file
    id: universe-required-cli-variants
    vars: { path: crates/universe-cli/recipe/variants.yaml }
  - extends_template: universe-required-file
    id: universe-required-development-doc
    vars: { path: docs/DEVELOPMENT.md }
  - extends_template: universe-required-file
    id: universe-required-pixi-manifest
    vars: { path: pixi.toml }
  - extends_template: universe-required-file
    id: universe-required-pyproject
    vars: { path: pyproject.toml }
  - extends_template: universe-required-file
    id: universe-required-skills-lock
    vars: { path: skills-lock.json }

  - id: universe-forbidden-files
    kind: file_absent
    paths:
      - NOTICE.md
      - .agents/NOTICE.md
      - backlog/MERGE-MAP.md
      - website
    message: "Forbidden standalone-cleanup path exists"
    level: error

  - id: universe-forbidden-directories
    kind: dir_absent
    paths:
      - .agents/licenses
      - third_party
      - website
      - dist
      - build
    message: "Forbidden directory exists"
    level: error

  # License/notice placeholders and empty-directory placeholders are forbidden
  # everywhere: nothing is vendored here, so nothing needs a copied license text.
  - id: universe-forbidden-basenames
    kind: file_absent
    paths:
      - "**/.gitkeep"
      - "**/copying"
      - "**/license"
      - "**/license.md"
      - "**/license.txt"
      - "**/notice"
      - "**/notice.md"
      - "**/notice.txt"
    message: "Forbidden license/notice/placeholder file"
    level: error

  - id: third-party-licenses-vocabulary
    kind: file_absent
    paths:
      - "**/LICENSE.txt"
      - "**/LICENCE"
      - "**/LICENCE.md"
    message: "License texts are not vendored: only the repository LICENSE names the terms"
    level: error

  # Repository automation is Python under scripts/; TypeScript must not creep in.
  - id: universe-no-typescript-automation
    kind: file_absent
    paths:
      - "scripts/**/*.ts"
    message: "Repository automation is Python under scripts/, not TypeScript"
    level: error

  # --- Manifest and gate configuration assertions -------------------------
  - id: universe-cargo-pixi-version-parity
    kind: cross_file
    source:
      file: Cargo.toml
      extract: { toml: "$.workspace.package.version" }
    targets:
      - file: pixi.toml
        extract: { toml: "$.workspace.version" }
    relation: equals
    message: "Workspace version must match between Cargo.toml and pixi.toml"
    level: error

  # The version chain `decision-126` implies: the root `Cargo.toml` holds the one literal a
  # release promotes, a crate manifest may only inherit it, and the crate's entrypoint reads it
  # back with `env!`, which the compiler resolves from that crate's own manifest. Break either
  # link and a bump silently misses a crate — which is exactly how `universe-assets` and
  # `universe-cli` were still spelling `"0.1.0"` by hand.
  - id: crate-manifests-inherit-the-workspace-version
    kind: toml_path_equals
    paths: "crates/*/Cargo.toml"
    path: "$.package.version.workspace"
    equals: true
    message: "A crate manifest must inherit `version.workspace = true` rather than declare its own version"
    level: error

  - id: crate-entrypoint-reads-its-manifest-version
    kind: every_matching_has
    select: "crates/*"
    when_iter: 'iter.has_file("Cargo.toml")'
    require:
      - kind: file_content_matches
        paths: "{path}/src/lib.rs"
        pattern: 'pub const VERSION: &str = env!\("CARGO_PKG_VERSION"\);'
    message: "A crate entrypoint must export `pub const VERSION: &str = env!(\"CARGO_PKG_VERSION\");`"
    level: error

  - id: universe-audit-task-runs-offline-gate
    kind: toml_path_matches
    paths: pixi.toml
    path: "$.tasks.audit.cmd"
    matches: '^python -m scripts\.audit check$'
    message: "The audit task must run the offline-first gate runner"
    level: error

  - id: universe-audit-sync-task-exists
    kind: toml_path_matches
    paths: pixi.toml
    path: "$.tasks['audit-sync'].cmd"
    matches: '^python -m scripts\.audit sync$'
    message: "The audit gate needs an audit-sync task to seed the advisory cache"
    level: error

  - id: universe-sandbox-cargo-vendor
    kind: toml_path_equals
    paths: .pixi-sandbox.toml
    path: "$.cargo_vendor"
    equals: true
    message: "The developer transport must vendor Cargo registry dependencies"
    level: error

  # --- Backlog store conventions -----------------------------------------
  # Frontmatter shape: the checks that need to compare two files (filename id to
  # frontmatter id, duplicate ids, milestone/dependency resolution) stay in
  # scripts/backlog_check.py, as do the status enums: alint's RE2 engine has no
  # look-ahead, so "a status line that is not one of the allowed values" is not
  # expressible as a regex. These rules cover the single-file conventions.
  - id: backlog-task-filename
    kind: filename_regex
    paths: "backlog/tasks/*.md"
    pattern: "^uni-[0-9]+ - [^/]+\\.md$"
    message: 'Backlog task files are named "uni-<n> - <Title-with-dashes>.md"'
    level: error

  - id: backlog-decision-filename
    kind: filename_regex
    paths: "backlog/decisions/*.md"
    pattern: "^decision-[0-9]+ - [^/]+\\.md$"
    message: 'Backlog decision files are named "decision-<n> - <Title>.md"'
    level: error

  - id: backlog-frontmatter-lead
    kind: file_content_matches
    paths: "backlog/{tasks,decisions,milestones,docs/**}/*.md"
    pattern: "\\A---\\n"
    message: "Backlog records start with a frontmatter block"
    level: error

  # Relative links inside the Backlog must resolve. The checker's own link walk
  # also follows links into the repository root; this rule covers the tree.
  - id: backlog-relative-links-resolve
    kind: markdown_links_resolve
    paths: "backlog/**/*.md"
    message: "Backlog link target does not exist"
    level: error

  # --- Agent skills -------------------------------------------------------
  # Registration is enforced by `scripts/skills_check.py`, which also hashes each skill and
  # knows the difference between a skill written here (locked by its installed path) and one
  # vendored from upstream (locked by the path it has there, so a `skills update` can find
  # it). A path-set comparison here can only express the first of those, so this rule would
  # fire on every correctly locked vendored skill.
  - id: skills-registered-in-lock
    kind: cross_file
    source:
      files: ".agents/skills/*/SKILL.md"
    targets:
      - file: skills-lock.json
        extract: { json: "$.skills.*.skillPath" }
    relation: registered
    register_as: "{path}"
    message: "Every agent skill directory must be registered in skills-lock.json"
    level: off

  - id: skills-lock-schema-version
    kind: json_path_equals
    paths: skills-lock.json
    path: "$.version"
    equals: 1
    message: "skills-lock.json schema version is 1"
    level: error

  # --- Behaviour-test layout ---------------------------------------------
  # Every workspace unit — a Rust crate or a Bun package — carries the same three
  # directories. `features/` is at the unit's root, not under `tests/`, so that the
  # specification sits beside the code it describes rather than inside the harness that
  # runs it, and so `scripts/gherkin_lint.py` can find it by name alone.
  #
  # `when_iter` keeps the rule honest about what a unit is: `crates/` and `packages/`
  # also hold directories that are not units (nothing today, but a stray directory must
  # not force a features/ tree). A unit is a directory that declares itself with a
  # manifest.
  - id: workspace-unit-layout
    kind: for_each_dir
    select: ["crates/*", "packages/*"]
    when_iter: 'iter.has_file("Cargo.toml") or iter.has_file("package.json")'
    require:
      - kind: dir_exists
        paths: "{path}/src"
        message: "a workspace unit keeps its sources in src/"
      - kind: dir_exists
        paths: "{path}/tests"
        message: "a workspace unit keeps its tests in tests/, never in src/"
      - kind: dir_exists
        paths: "{path}/features"
        message: "a workspace unit states its behaviour in features/"

    level: error

  # A features/ directory with no scenario in it satisfies the layout rule and specifies
  # nothing, so the documents themselves are required.
  - id: features-directory-holds-scenarios
    kind: dir_contains
    select: "{crates,packages}/*/features"
    require: ["*.feature"]
    message: "features/ must hold at least one .feature document"
    level: error

  # The harness that binds the steps has to exist too, or the scenarios are prose.
  - id: rust-tests-directory-holds-tests
    kind: dir_contains
    select: "crates/*/tests"
    require: ["*.rs"]
    message: "tests/ must hold at least one integration test"
    level: error

  - id: package-tests-directory-holds-tests
    kind: dir_contains
    select: "packages/*/tests"
    require: ["*.ts"]
    message: "tests/ must hold at least one test module"
    level: error

  # --- Session start ------------------------------------------------------
  # `AGENTS.md` rule 14 tells an agent to bring the environment up before it reads anything,
  # and the rule is only worth having if the three steps stay in the file. Each pattern is
  # the command itself rather than a sentence about it, so a rewrite that keeps the meaning
  # keeps the rule green and a rewrite that drops the command does not.
  - id: agents-md-checks-for-pixi
    kind: file_content_matches
    paths: "AGENTS.md"
    pattern: "command -v pixi"
    message: "AGENTS.md must say `command -v pixi` is the first thing a session checks"
    level: error

  - id: agents-md-names-the-restore-script
    kind: file_content_matches
    paths: "AGENTS.md"
    pattern: "bash scripts/restore\\.sh"
    message: "AGENTS.md must name `bash scripts/restore.sh` as the way back when Pixi is absent"
    level: error

  - id: agents-md-installs-the-hooks-at-session-start
    kind: file_content_matches
    paths: "AGENTS.md"
    pattern: "pixi run setup"
    message: "AGENTS.md must say the session installs the Lefthook hooks with `pixi run setup`"
    level: error

  # --- Prose linting ------------------------------------------------------
  # Vale owns how the documentation is written (`decision-138`). These rules own only the
  # question Vale cannot answer about itself: is the linter still wired to a configuration
  # and a style, or has a rename left `lint-prose` reading nothing and reporting clean?
  - id: vale-configuration-present
    kind: file_exists
    paths: ".vale.ini"
    message: "prose linting needs `.vale.ini`, which names the styles and the vocabulary"
    level: error

  - id: vale-vocabulary-present
    kind: file_exists
    paths: ".vale/styles/config/vocabularies/Universe/accept.txt"
    message: "the vocabulary `.vale.ini` names must exist, or every rule loses its exceptions"
    level: error

  # `StylesPath` is declared in `.vale.ini`; this rule holds the two halves together, so a
  # style directory that is renamed leaves a `BasedOnStyles` entry naming nothing.
  - id: vale-style-directory-holds-a-rule
    kind: dir_contains
    select: ".vale/styles/Universe"
    require: ["*.yml"]
    message: "the project style must hold at least one rule file"
    level: error
