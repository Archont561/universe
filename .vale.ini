# Prose linting, by Vale.
#
# Vale answers one question — is this document written the way this repository writes? — and
# `alint` answers the other: does the repository have the files and the shape it declares
# (`.alint.yml`, `decision-121`). Neither reads the other's rules, which is why the split is
# worth stating: a term that must never appear is a Vale rule, a file that must exist is an
# alint rule.
#
# The corpus is decided by `scripts/prose_lint.py` rather than by this file, because Vale has
# no way to say "these documents and not those". That module's docstring names what it lints
# and why the Backlog is not in the set (`decision-138`).

StylesPath = .vale/styles
MinAlertLevel = suggestion

# The vocabulary holds the names this repository spells one way. It is load-bearing for the
# third-party styles too: an accepted term becomes an exception in every rule they define.
Vocab = Universe

[*.md]
BasedOnStyles = Vale, Universe

# Spelling is the one rule switched off, and it is off deliberately. Vale's dictionary is
# English, and this corpus is dense with proper nouns and product names — `rattler-build`,
# `minisign`, `repodata`, `CEP-15` — that no dictionary carries. Every one of them would need
# an entry in the vocabulary, and a vocabulary that is a word list stops being a statement
# about how the repository writes. Terms and the house rules carry the checks that matter.
Vale.Spelling = NO
