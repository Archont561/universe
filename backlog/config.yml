project_name: "Universe"
default_status: "To Do"
statuses: ["To Do", "In Progress", "Done"]
labels:
  - "airlock"
  - "architecture"
  - "audit"
  - "bootstrap"
  - "channel"
  - "ci"
  - "core"
  - "deprecation"
  - "docs"
  - "infrastructure"
  - "offline"
  - "portal"
  - "release"
  - "skills"
  - "testing"
date_format: yyyy-mm-dd
max_column_width: 24
auto_open_browser: false
default_port: 6420
# Backlog operations are local and filesystem-only so task work remains possible
# in offline development environments. Branch freshness is best-effort.
remote_operations: false
auto_commit: false
filesystem_only: true
bypass_git_hooks: false
check_active_branches: false
active_branch_days: 30
task_prefix: "UNI"
