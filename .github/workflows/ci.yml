# Owner-lane CI for the standalone Universe repository. Workflows call named Pixi
# tasks only; every external action is pinned to a full commit SHA.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  gates:
    name: gates
    runs-on: ubuntu-latest
    # Without a bound, a stalled step holds the runner for the job's default six
    # hours before anything is reported, and the pull request shows `pending`
    # rather than a failure. A hung gate is a failure, and should read as one.
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # PR commit messages come from the GitHub API below; the build itself needs no history.
          fetch-depth: 1

      - name: Install Pixi environment
        uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
        with:
          pixi-version: v0.83.0
          environments: default
          cache: true
          locked: true

      - name: Run gates
        run: pixi run gates

      - name: Validate pull-request commits
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          # Avoid an unshallow clone just to validate commit messages. Fetch all PR commits
          # through the read-only API and pass each complete message to the existing checker.
          set -euo pipefail
          gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/commits?per_page=100" \
            --jq '.[].commit.message | @base64' |
            while IFS= read -r message; do
              printf '%s' "$message" | base64 --decode | pixi run lint-commit
            done

      - name: Upload coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: target/coverage
          if-no-files-found: error
