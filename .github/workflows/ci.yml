# Owner-lane CI for the standalone Universe repository. Workflows call named Pixi
# tasks only; every external action is pinned to a full commit SHA.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write  # TEMPORARY: publish the failing gate's log to a branch
  pull-requests: read

jobs:
  gates:
    name: gates
    runs-on: ubuntu-latest
    # Without a bound, a stalled step holds the runner for the job's default six
    # hours before anything is reported, and the pull request shows `pending`
    # rather than a failure. A hung gate is a failure, and should read as one.
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # PR commit messages come from the GitHub API below; the build itself needs no history.
          fetch-depth: 1

      - name: Install Pixi environment
        uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
        with:
          pixi-version: v0.83.0
          environments: default
          cache: true
          locked: true

      # TEMPORARY, reverted before merge: one step per gate, because the aggregate task
      # reports only "exit code 1" and the run log is unreadable from outside the runner.
      - name: gate fmt-check
        shell: bash
        run: pixi run fmt-check 2>&1 | tee "/tmp/fmt-check.log"
      # TEMPORARY, reverted before merge: one step per gate, because the aggregate task
      # reports only "exit code 1" and the run log is unreadable from outside the runner.
      - name: gate lint
        shell: bash
        run: pixi run lint 2>&1 | tee "/tmp/lint.log"
      # TEMPORARY, reverted before merge: one step per gate, because the aggregate task
      # reports only "exit code 1" and the run log is unreadable from outside the runner.
      - name: gate typecheck
        shell: bash
        run: pixi run typecheck 2>&1 | tee "/tmp/typecheck.log"
      # TEMPORARY, reverted before merge: one step per gate, because the aggregate task
      # reports only "exit code 1" and the run log is unreadable from outside the runner.
      - name: gate test
        shell: bash
        run: pixi run test 2>&1 | tee "/tmp/test.log"
      # TEMPORARY, reverted before merge: one step per gate, because the aggregate task
      # reports only "exit code 1" and the run log is unreadable from outside the runner.
      - name: gate backlog-check
        shell: bash
        run: pixi run backlog-check 2>&1 | tee "/tmp/backlog-check.log"
      # TEMPORARY, reverted before merge: one step per gate, because the aggregate task
      # reports only "exit code 1" and the run log is unreadable from outside the runner.
      - name: gate repo-check
        shell: bash
        run: pixi run repo-check 2>&1 | tee "/tmp/repo-check.log"
      # TEMPORARY, reverted before merge: one step per gate, because the aggregate task
      # reports only "exit code 1" and the run log is unreadable from outside the runner.
      - name: gate skills-check
        shell: bash
        run: pixi run skills-check 2>&1 | tee "/tmp/skills-check.log"
      # TEMPORARY, reverted before merge: one step per gate, because the aggregate task
      # reports only "exit code 1" and the run log is unreadable from outside the runner.
      - name: gate alint-check
        shell: bash
        run: pixi run alint-check 2>&1 | tee "/tmp/alint-check.log"
      # TEMPORARY, reverted before merge: one step per gate, because the aggregate task
      # reports only "exit code 1" and the run log is unreadable from outside the runner.
      - name: gate crate-check
        shell: bash
        run: pixi run crate-check 2>&1 | tee "/tmp/crate-check.log"
      # TEMPORARY, reverted before merge: one step per gate, because the aggregate task
      # reports only "exit code 1" and the run log is unreadable from outside the runner.
      - name: gate web-check
        shell: bash
        run: pixi run web-check 2>&1 | tee "/tmp/web-check.log"
      # TEMPORARY, reverted before merge: one step per gate, because the aggregate task
      # reports only "exit code 1" and the run log is unreadable from outside the runner.
      - name: gate coverage
        shell: bash
        run: pixi run coverage 2>&1 | tee "/tmp/coverage.log"
      # TEMPORARY, reverted before merge: one step per gate, because the aggregate task
      # reports only "exit code 1" and the run log is unreadable from outside the runner.
      - name: gate lint-actions
        shell: bash
        run: pixi run lint-actions 2>&1 | tee "/tmp/lint-actions.log"
      # TEMPORARY, reverted before merge: one step per gate, because the aggregate task
      # reports only "exit code 1" and the run log is unreadable from outside the runner.
      - name: gate audit
        shell: bash
        run: pixi run audit 2>&1 | tee "/tmp/audit.log"
      # TEMPORARY, reverted before merge: one step per gate, because the aggregate task
      # reports only "exit code 1" and the run log is unreadable from outside the runner.
      - name: gate build
        shell: bash
        run: pixi run build 2>&1 | tee "/tmp/build.log"
      # TEMPORARY, reverted before merge: push the gate logs to a throwaway branch, the only
      # output channel from this runner that is readable from outside it.
      - name: Publish the gate logs to a branch
        if: failure()
        shell: bash
        run: |
          mkdir -p ci-logs
          for log in /tmp/*.log; do
            sed 's/\x1b\[[0-9;]*m//g' "$log" > "ci-logs/$(basename "$log")"
          done
          git config user.name "ci-logs"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q -B ci-logs
          git add -f ci-logs
          git commit -q -m "ci: gate logs for ${GITHUB_RUN_ID}" || true
          git push -q -f origin ci-logs

      - name: Validate pull-request commits
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          # Avoid an unshallow clone just to validate commit messages. Fetch all PR commits
          # through the read-only API and pass each complete message to the existing checker.
          set -euo pipefail
          gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/commits?per_page=100" \
            --jq '.[].commit.message | @base64' |
            while IFS= read -r message; do
              printf '%s' "$message" | base64 --decode | pixi run lint-commit
            done

      - name: Upload coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: target/coverage
          if-no-files-found: error
