# Owner-lane CI for the standalone Universe repository. Workflows call named Pixi
# tasks only; every external action is pinned to a full commit SHA.
#
# Three lanes, chosen so the cheapest answer arrives first:
#
# - `fast`  — format, backlog, repo, alint, crate-boundary, Gherkin, workflow lint. Seconds,
#             no compile. A typo in a Backlog record is reported here, not behind a build.
# - `heavy` — the compile-based lanes: clippy, typecheck, the two `universe` facade checks,
#             coverage (which runs the whole test suite under instrumentation), and build.
# - `web`   — the Bun workspace.
#
# `heavy` and `web` are selected by the diff (`scripts/detect_changes.py`), and `gates`
# aggregates them under the name the branch protection requires. The aggregator is not
# optional: with lanes skipped by path, a required check that never reports leaves a pull
# request blocked on `Expected`, so the verdict always runs and decides what it owes.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.detect.outputs.code }}
      web: ${{ steps.detect.outputs.web }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The classifier diffs against the base commit, which needs its history.
          fetch-depth: 0
          persist-credentials: false

      - name: Decide which lanes the diff needs
        id: detect
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/detect_changes.py \
            --base "$BASE_SHA" --head "$HEAD_SHA" --event "$EVENT_NAME" \
            --github-output "$GITHUB_OUTPUT"

  fast:
    name: fast checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install Pixi environment
        uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
        with:
          pixi-version: v0.83.0
          environments: default
          cache: true
          locked: true

      - name: Run the checks that need no compile
        run: pixi run --frozen check-fast

      - name: Lint the workflows
        run: pixi run --frozen lint-actions

      - name: Validate pull-request commits
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          # Avoid an unshallow clone just to validate commit messages. Fetch all PR commits
          # through the read-only API and pass each complete message to the existing checker.
          set -euo pipefail
          gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/commits?per_page=100" \
            --jq '.[].commit.message | @base64' |
            while IFS= read -r message; do
              printf '%s' "$message" | base64 --decode | pixi run lint-commit
            done

  # Two jobs rather than one, because the work is two complete compilations and they do not
  # share a single artifact: clippy builds every target with the ordinary flags, and
  # `cargo llvm-cov` rebuilds the same graph with `-C instrument-coverage`. Measured in the
  # development sandbox on two cores, the pair cost 112s + 264s; run in one job they are
  # additions, run in two they are a maximum. The names are kept (`build and test` for the
  # compile-heavy half) so a required check that answers to one of them keeps reporting.
  lint:
    name: lint and typecheck
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Incremental artefacts are never restored from the cache, so producing them buys the
    # runner nothing and costs it disk.
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install Pixi environment
        uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
        with:
          pixi-version: v0.83.0
          environments: default
          cache: true
          locked: true

      - name: Restore the Rust build cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # A key of its own. GitHub's caches are immutable per key, so two jobs sharing one
          # key means whichever saves first decides what the other restores — and the loser
          # rebuilds from scratch on every run.
          shared-key: universe-lint

      # `check-fast` already ran in its own lane, so this is the compile-based remainder
      # rather than the whole of `check`: the cheap half must not be paid for twice.
      - name: Lint, type-check, and check the generated files
        run: |
          pixi run --frozen lint
          pixi run --frozen typecheck
          pixi run --frozen ci-check
          pixi run --frozen airlock-check

  heavy:
    name: build and test
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    # Without a bound, a stalled step holds the runner for the job's default six hours before
    # anything is reported, and the pull request shows `pending` rather than a failure. A hung
    # gate is a failure, and should read as one.
    timeout-minutes: 25
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install Pixi environment
        uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
        with:
          pixi-version: v0.83.0
          environments: default
          cache: true
          locked: true

      - name: Restore the Rust build cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # The instrumentation flags are part of the fingerprint, so this cache holds the
          # build `cargo llvm-cov` produces and nothing else.
          shared-key: universe-coverage

      # The whole test suite runs here, through `cargo llvm-cov nextest`, and the thresholds
      # are enforced by the task rather than by this file.
      - name: Cover
        run: pixi run --frozen coverage

      - name: Build
        run: pixi run --frozen build

      - name: Upload coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: target/coverage
          if-no-files-found: error

  web:
    name: web workspace
    needs: [changes]
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install Pixi environment
        uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
        with:
          pixi-version: v0.83.0
          environments: default
          cache: true
          locked: true

      - name: Check the Bun workspace
        run: pixi run --frozen web-check

  # The required check. It keeps its name so branch protection does not need editing, and it
  # is the only place that knows which lanes were supposed to run.
  gates:
    name: gates
    if: always()
    needs: [changes, fast, lint, heavy, web]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail when a selected lane did not succeed
        env:
          CHANGES: ${{ needs.changes.result }}
          FAST: ${{ needs.fast.result }}
          LINT: ${{ needs.lint.result }}
          HEAVY: ${{ needs.heavy.result }}
          WEB: ${{ needs.web.result }}
          CODE: ${{ needs.changes.outputs.code }}
          WEB_CHANGED: ${{ needs.changes.outputs.web }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CHANGES" == success ]] || { echo "change detection failed: $CHANGES" >&2; exit 1; }
          [[ "$FAST" == success ]] || { echo "fast checks did not pass: $FAST" >&2; exit 1; }
          # A lane that was not selected reports `skipped`, which is a pass only when the
          # diff says it had nothing to check.
          [[ "$CODE" == true ]] && { [[ "$LINT" == success ]] || { echo "lint and typecheck did not pass: $LINT" >&2; exit 1; }; }
          [[ "$CODE" == true ]] && { [[ "$HEAVY" == success ]] || { echo "build and test did not pass: $HEAVY" >&2; exit 1; }; }
          [[ "$WEB_CHANGED" == true ]] && { [[ "$WEB" == success ]] || { echo "web workspace did not pass: $WEB" >&2; exit 1; }; }
          echo "every selected lane passed (code=$CODE web=$WEB_CHANGED)"
