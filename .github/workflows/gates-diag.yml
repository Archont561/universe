# TEMPORARY diagnostic — one job per gate task.
#
# `pixi run gates` is a single CI step, so a failing run says only "gates failed".
# Job conclusions are readable over the REST API even when logs are not, so this
# runs each gate as its own job and makes the failing task identifiable.
#
# Deleted once the failure is named.

name: gates diag

on:
  push:
    branches: [arena/37fee954-universe]
    paths:
      - ".github/workflows/gates-diag.yml"

permissions:
  contents: read

concurrency:
  group: gates-diag-${{ github.repository }}
  cancel-in-progress: false

jobs:
  task:
    name: ${{ matrix.task }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        task:
          - lint
          - typecheck
          - test
          - coverage
          - crate-check
          - audit
          - build
          - web-check
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: arena/37fee954-universe

      - uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
        with:
          pixi-version: v0.83.0
          environments: default
          cache: true
          locked: true

      - name: Run ${{ matrix.task }}
        run: pixi run --frozen ${{ matrix.task }}
