# Conda umbrella package: installs the thin `universe` command facade.
schema_version: 1

context:
  version: "0.1.0"
  kit_min_version: "0.1.0"
  airlock_min_version: "0.1.0"

package:
  name: universe
  version: ${{ version }}

source:
  - path: ../../..

build:
  number: 0
  script:
    env:
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
    content:
      - if: unix
        then:
          - cargo build --release --locked --package universe-cli
          - mkdir -p "$PREFIX/bin"
          - install target/release/universe "$PREFIX/bin/universe"
        else:
          - cargo build --release --locked --package universe-cli
          - if not exist "%LIBRARY_BIN%" mkdir "%LIBRARY_BIN%"
          - copy /Y "target\\release\\universe.exe" "%LIBRARY_BIN%\\universe.exe"

requirements:
  build:
    - rust >=1.99.0,<2
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
  run:
    - universe-kit >=${{ kit_min_version }},<1
    - universe-airlock >=${{ airlock_min_version }},<1

tests:
  - script:
      - universe --version

about:
  summary: Thin front door for separately installable Universe producer and consumer tools
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/Archont561/universe
  repository: https://github.com/Archont561/universe
