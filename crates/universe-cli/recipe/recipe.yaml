# Conda umbrella package: installs the thin `universe` command facade.
schema_version: 1

context:
  version: "0.1.0"
  # Pre-1.0 the compatibility boundary is the minor version (`decision-126`), so
  # `>=0.1.0,<0.2` is the conda spelling of Cargo's `^0.1.0`. A `<1` upper bound was wrong:
  # it would let the solver pair this umbrella package with a 0.9 component that the version
  # policy explicitly allows to be incompatible. Move both bounds together.
  kit_min_version: "0.1.0"
  kit_max_version: "0.2"
  airlock_min_version: "0.1.0"
  airlock_max_version: "0.2"

package:
  name: universe
  version: ${{ version }}

source:
  - path: ../../..

build:
  number: 0
  script:
    env:
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
    content:
      - if: unix
        then:
          - cargo build --release --locked --package universe-cli
          - mkdir -p "$PREFIX/bin"
          - install target/release/universe "$PREFIX/bin/universe"
        else:
          - cargo build --release --locked --package universe-cli
          - if not exist "%LIBRARY_BIN%" mkdir "%LIBRARY_BIN%"
          - copy /Y "target\\release\\universe.exe" "%LIBRARY_BIN%\\universe.exe"

requirements:
  build:
    - rust >=1.99.0,<2
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
  run:
    - universe-kit >=${{ kit_min_version }},<${{ kit_max_version }}
    - universe-airlock >=${{ airlock_min_version }},<${{ airlock_max_version }}

tests:
  - script:
      - universe --version

about:
  summary: Thin front door for separately installable Universe producer and consumer tools
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/Archont561/universe
  repository: https://github.com/Archont561/universe
