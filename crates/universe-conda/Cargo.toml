[package]
name = "universe-conda"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
publish.workspace = true
description = "Conda adapter: archive inspection, artifact auditing, and channel metadata for Universe"

[lints]
workspace = true

[dependencies]
goblin = { workspace = true }
rattler_conda_types = { workspace = true }
rattler_digest = { workspace = true }
rattler_package_streaming = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
spdx = { workspace = true }
tar = { workspace = true }
thiserror = { workspace = true }
universe-core = { workspace = true }

[dev-dependencies]
# Fixtures are built, not downloaded: a `.conda` is a zip of two zstd tars, and a
# fixture builder that spells that out is a specification of the format the reader
# has to satisfy. Neither crate needs a compression feature: the outer zip stores
# its members uncompressed, and only the inner tars are zstd.
tempfile = { workspace = true }
zstd = { version = "0.14", default-features = false }
zip = { version = "9", default-features = false }
