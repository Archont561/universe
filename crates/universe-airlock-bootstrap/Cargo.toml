[package]
name = "universe-airlock-bootstrap"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
publish.workspace = true
description = "Thin standalone bootstrap executable for Universe Airlock"

[lints]
workspace = true

[dependencies]
# The signature verifier `decision-131` requires: Ed25519 over a minisign detached format,
# with no dependencies of its own, which is why it is the one crypto crate this binary takes.
# The key itself lives in `src/signature.rs` as a compile-time constant.
minisign-verify = { workspace = true }
# Reading a `.conda` is a zip of two zstd-compressed tars. `UNI-52` records that owning the
# extractor in Rust is an option rather than a prerequisite; this build takes the option, because
# the alternative is bundling an installer for a payload whose every file is already digest-checked.
# `zip` needs no compression feature: the format stores its members uncompressed.
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tar = { workspace = true }
universe-core = { workspace = true }
zip = { version = "9", default-features = false }
zstd = { version = "0.14", default-features = false }

[dev-dependencies]
# Scenario harness: `features/*.feature` states the behaviour, `tests/*_bdd.rs` binds the steps.
rstest = { workspace = true }
rstest-bdd = { workspace = true }
rstest-bdd-macros = { workspace = true }
tempfile = { workspace = true }

[[bin]]
name = "universe-airlock-bootstrap"
path = "src/main.rs"
