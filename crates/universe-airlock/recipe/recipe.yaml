# Co-located Conda package recipe for the finite offline Universe Airlock CLI.
schema_version: 1

context:
  version: "0.1.0"

package:
  name: universe-airlock
  version: ${{ version }}

source:
  - path: ../../..

build:
  number: 0
  script:
    env:
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
    content:
      - if: unix
        then:
          - cargo build --release --locked --package universe-airlock
          - mkdir -p "$PREFIX/bin"
          - install target/release/universe-airlock "$PREFIX/bin/universe-airlock"
        else:
          - cargo build --release --locked --package universe-airlock
          - if not exist "%LIBRARY_BIN%" mkdir "%LIBRARY_BIN%"
          - copy /Y "target\\release\\universe-airlock.exe" "%LIBRARY_BIN%\\universe-airlock.exe"

requirements:
  # The C standard library is a build dependency here; every symbol these binaries need at
  # run time comes from the C library that the virtual `__glibc` package already stands for.
  # Accepting its run export would write `libgcc` into `depends`, and a static channel does
  # not carry libgcc, so a consumer restoring that channel offline cannot solve the package.
  # `recipe.run_exports.leaked` refuses a recipe that takes the stdlib without saying this.
  ignore_run_exports:
    by_name:
      - libgcc
  build:
    - rust >=1.99.0,<2
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}

tests:
  - script:
      - universe-airlock --version
  # UNI-38 #2: the installed consumer must do more than report a version. This is the same
  # offline verification the library tests exercise, run against a closed two-file payload.
  - script:
      - universe-airlock verify --payload payload
    files:
      recipe:
        - payload/universe-release.json
        - payload/airlock-0.1.0.conda

about:
  summary: Finite offline consumer for verified sealed Universe snapshots
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/Archont561/universe
  repository: https://github.com/Archont561/universe
