# Co-located Conda package recipe for the finite offline Universe Airlock CLI.
schema_version: 1

context:
  version: "0.1.0"

package:
  name: universe-airlock
  version: ${{ version }}

source:
  - path: ../../..

build:
  number: 0
  script:
    env:
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
    content:
      - if: unix
        then:
          - cargo build --release --locked --package universe-airlock
          - mkdir -p "$PREFIX/bin"
          - install target/release/universe-airlock "$PREFIX/bin/universe-airlock"
        else:
          - cargo build --release --locked --package universe-airlock
          - if not exist "%LIBRARY_BIN%" mkdir "%LIBRARY_BIN%"
          - copy /Y "target\\release\\universe-airlock.exe" "%LIBRARY_BIN%\\universe-airlock.exe"

requirements:
  build:
    - rust >=1.99.0,<2
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}

tests:
  - script:
      - universe-airlock --version

about:
  summary: Finite offline consumer for verified sealed Universe snapshots
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/Archont561/universe
  repository: https://github.com/Archont561/universe
