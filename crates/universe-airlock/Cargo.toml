[package]
name = "universe-airlock"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
publish.workspace = true
description = "Finite offline snapshot consumer CLI for Universe"

[dev-dependencies]
# Scenario harness: `features/*.feature` states the behaviour, `tests/*_bdd.rs` binds the steps.
rstest = { workspace = true }
rstest-bdd = { workspace = true }
rstest-bdd-macros = { workspace = true }

[lints]
workspace = true

[dependencies]
# Declared for the consumer CLI. Nothing consumes it yet: the dependency closes
# over the offline vendor bundle first (relock + sandbox repack), so the slice
# that wires the parser in can be compiled and gated locally.
argp = { workspace = true }
universe-core = { workspace = true }

[[bin]]
name = "universe-airlock"
path = "src/main.rs"
