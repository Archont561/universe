[package]
name = "universe-airlock"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
publish.workspace = true
description = "Finite offline snapshot consumer CLI for Universe"

[dev-dependencies]
# Scenario harness: `features/*.feature` states the behaviour, `tests/*_bdd.rs` binds the steps.
rstest = { workspace = true }
rstest-bdd = { workspace = true }
rstest-bdd-macros = { workspace = true }
# A sandbox test has to hand the binary a real `.conda`, and writing one is a zip of two zstd
# tars. These are the crates the bootstrap already links for the same format, taken here as test
# dependencies rather than reimplemented, so a fixture is the format the reader has to satisfy.
serde_json = { workspace = true }
sha2 = { workspace = true }
tar = { workspace = true }
tempfile = { workspace = true }
zip = { version = "9", default-features = false }
zstd = { version = "0.14", default-features = false }

[lints]
workspace = true

[dependencies]
argp = { workspace = true }
serde = { workspace = true }
# `decision-122` makes the bootstrap a phase of Airlock, not a separate edition. Its
# verification library is the one implementation of the payload integrity rules, so the
# consumer calls it rather than growing a second copy that could drift.
universe-airlock-bootstrap = { workspace = true }
universe-core = { workspace = true }

[[bin]]
name = "universe-airlock"
path = "src/main.rs"
