[package]
name = "universe-channel"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
publish.workspace = true
description = "Conda channel rendering and publication for Universe: fragments in, deterministic static channel out"

[lints]
workspace = true

[dependencies]
reqwest = { workspace = true }
serde = { workspace = true }
sha2 = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
# Scenario harness: `features/*.feature` states the behaviour, `tests/*_bdd.rs` binds the steps.
rstest = { workspace = true }
rstest-bdd = { workspace = true }
rstest-bdd-macros = { workspace = true }
proptest = { workspace = true }
tempfile = { workspace = true }
# A fake HTTP endpoint, for the store writers that upload rather than push a tree. It lands
# before its first consumer because the only way its sources reach the offline developer
# bundle is through `main` and the sandbox publisher: declaring it here, letting the relock
# bot resolve it, and merging is what makes `cargo test` able to build it locally next time.
wiremock = { workspace = true }
tokio = { workspace = true }
