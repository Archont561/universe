[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
confidence-threshold = 0.95
unused-allowed-license = "allow"
# Two dev-only additions, each named rather than folded into "any OSI licence":
#
# - `ISC` for `rstest-bdd` and its sibling crates, which execute the scenarios under
#   `pixi run test` and are never linked into a shipped binary.
# - `Zlib` for `foldhash`, reached through `hashbrown` in the same dev graph.
#
# Neither arrives in a released artifact: the audit gate checks the whole workspace,
# including dev-dependencies, which is why dev-only licences have to be named here at
# all. If the scenario runner is ever reconsidered, these two lines go with it.
allow = ["Apache-2.0", "ISC", "MIT", "Unicode-3.0", "Zlib"]

[licenses.private]
# Workspace crates are private and are not published as crates.io packages.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = [
  { name = "openssl", reason = "Use pure-Rust rustls for portable network code" },
  { name = "openssl-sys", reason = "Use pure-Rust rustls for portable network code" },
  { name = "native-tls", reason = "Use pure-Rust rustls for portable network code" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
