# The owner-lane manifest for Universe itself.
#
# This file is the first consumer of its own schema: the release workflow in
# `.github/workflows/universe.yml` is rendered from it, so a facet that does not fit this
# repository is a facet that does not fit a real project. `UNI-41` #7 says the same thing
# as a criterion, and `crates/universe-kit/tests/manifest.rs` fails if this file does not
# parse cleanly or lints with any finding.
#
# Scope is `decision-132`, widened by its main-CLI amendment and by `UNI-55`: `v0.1.0`
# publishes four `linux-64` Conda packages — the Airlock consumer, the `universe-kit`
# producer, the umbrella `universe` facade, and the thin `universe-airlock-bootstrap`
# artifact a disconnected host runs first. The package list, the platform list, and the
# store list are the whole of it — another package or platform is a change to this file,
# not to the workflow.

schema = 1

[project]
name = "universe"
description = "Self-hosted universes of software, data, models, and skills, with sealed offline delivery"
repository = "https://github.com/Archont561/universe"
# One platform, deliberately. A second entry here renders a second build matrix row and a
# second subdir in the channel, neither of which `v0.1.0` proves.
platforms = ["linux-64"]

[build]
# Consulted by `plan`, `build`, and `test` in that order.
channels = ["conda-forge"]
skip_existing = "all"

# Every flag is the strict value. A package that needs an exception declares it here in a
# later change, with the reason, rather than the default being lenient for everyone.
[audit]
enforce_license_file = true
require_valid_spdx = true
forbid_build_path_leak = true
verify_arch_headers = true

[[packages]]
name = "universe-airlock"
kind = "conda"
# The recipe owns the build; this command only invokes it. `-e packaging` is not optional:
# `rattler-build` lives in that environment, and running the task in `default` fails with a
# bare "command not found". `--frozen` keeps the build toolchain to the locked environment,
# which is what makes the artifact reproducible from a commit rather than from whatever the
# runner had installed.
command = ["pixi", "run", "-e", "packaging", "--frozen", "package-airlock"]
platforms = ["linux-64"]
outputs = ["output/universe-airlock/linux-64/*.conda"]
# Mandatory because the package publishes: a package with no smoke command is a package
# whose installability nobody checked.
smoke = ["universe-airlock --version"]
# Publication order: the hosted channel first, then the branch that restores from Git.
# GitHub Releases is implicit: `release = true` reaches the `releases` store below without
# naming it here, per decision-127.
publish = ["prefix-dev", "branch"]
release = true

# Discovery metadata authored here rather than fetched, so a catalog can be built with
# no network lookup.
[packages.catalog]
title = "Universe Airlock"
summary = "Finite offline consumer for verified sealed snapshots"
license = "MIT"

[[packages]]
name = "universe-airlock-bootstrap"
kind = "conda"
# A phase of the Airlock edition, not a third product (`decision-122`, `UNI-55`). It runs
# before anything is restored, so it declares no run dependency on the consumer it is about
# to install, and nothing depends on it: `depends_on` is absent on purpose, and the facade
# below does not name it. `package-airlock-bootstrap` needs no `--test=skip` because its
# recipe declares no run requirements at all, so rattler-build's post-build test has a
# solvable environment.
command = ["pixi", "run", "-e", "packaging", "--frozen", "package-airlock-bootstrap"]
platforms = ["linux-64"]
outputs = ["output/universe-airlock-bootstrap/linux-64/*.conda"]
smoke = ["universe-airlock-bootstrap --version"]
publish = ["prefix-dev", "branch"]
release = true

[packages.catalog]
title = "Universe Airlock Bootstrap"
summary = "Thin native bootstrapper that verifies and activates a pinned Airlock restore"
license = "MIT"

[[packages]]
name = "universe-kit"
kind = "conda"
# The producer CLI has its own recipe and Pixi task. It is published with Airlock so an
# owner lane can install the tool that rendered this manifest without building from source.
command = ["pixi", "run", "-e", "packaging", "--frozen", "package-kit"]
platforms = ["linux-64"]
outputs = ["output/universe-kit/linux-64/*.conda"]
smoke = ["universe-kit --version"]
publish = ["prefix-dev", "branch"]
release = true

[packages.catalog]
title = "Universe Kit"
summary = "Connected owner and producer CLI for portable Universe catalogs"
license = "MIT"

[[packages]]
name = "universe"
kind = "conda"
# The thin facade depends on both published components. `depends_on` makes that order
# explicit for `plan`; `package-cli` skips rattler-build's post-build test because the
# run dependencies are not in the channel until this same release publishes them. The
# workspace gates prove the facade binary itself.
command = ["pixi", "run", "-e", "packaging", "--frozen", "package-cli"]
depends_on = ["universe-kit", "universe-airlock"]
platforms = ["linux-64"]
outputs = ["output/universe/linux-64/*.conda"]
smoke = ["universe --version"]
publish = ["prefix-dev", "branch"]
release = true

[packages.catalog]
title = "Universe"
summary = "Thin front door for separately installable Universe producer and consumer tools"
license = "MIT"

# The hosted channel. `prefix.dev` exchanges the workflow identity for a short-lived
# token, so no long-lived credential exists to leak (`decision-127`; `decision-8`).
[[stores]]
name = "prefix-dev"
kind = "prefix-dev"
channel = "archont561/archont561"
writable = true
needs_index = false
read_auth = "none"
auth = "oidc"
# The owner registered this channel's trusted publisher under the `prefix` environment.
# GitHub puts that name in the OIDC token only for a job that declares the environment,
# so the renderer emits `environment: prefix` on this store's publish job and no other.
environment = "prefix"
verifier = "registry"

# Universe's own static channel, served from a git branch: metadata and package bytes in
# one tree, restored by a host whose only reachable transport is Git (`UNI-58`).
[[stores]]
name = "branch"
kind = "branch"
# The ref the snapshot tree is pushed to. It is declared rather than left to the tool's default
# because it is where the bytes land: `channel` was this repository's old, unnamespaced name, and
# a renderer that omitted the flag would publish the next release to a ref nobody reads.
branch = "universe/conda-channel"
writable = true
needs_index = true
read_auth = "none"
auth = "token"
# Names only, never values. The renderer emits `${{ secrets.<name> }}`. `GITHUB_TOKEN` is
# the short-lived token GitHub injects into every run, so this store holds no long-lived
# credential to create, leak or rotate. The job's `contents: write` is enough because mirror
# branches are public and unprotected (`decision-127`).
secrets = ["GITHUB_TOKEN"]
verifier = "file"

# The implicit GitHub Releases destination. Every package with `release = true` reaches
# this store; the package does not name it, but the store carries the repository and the
# built-in token the REST API needs. `contents: write` is rendered on its publish job.
[[stores]]
name = "releases"
kind = "releases"
channel = "Archont561/universe"
writable = true
needs_index = false
read_auth = "none"
auth = "token"
secrets = ["GITHUB_TOKEN"]
verifier = "registry"

# The hosted channel index. GitHub Pages serves the tree `universe index` renders from what the
# three stores above accepted, so a consumer points a solver at one URL and reads the same bytes
# `pixi` would read from prefix.dev or from the branch.
#
# Not a destination: nothing uploads here, which is why it is `static` and not writable. The
# deployment is rendered from this declaration — `pages = true` adds the two jobs that generate
# the index and deploy it — rather than from a hand-written workflow, so the site cannot describe
# a channel the release did not publish. `url` is the address the index advertises as its own
# base URL, which is what makes the repodata it writes point back at itself.
[[stores]]
name = "pages"
kind = "static"
writable = false
needs_index = true
url = "https://archont561.github.io/universe"
pages = true
read_auth = "none"

[release]
tag_pattern = "v*"
changelog = "CHANGELOG.md"

[[release.scope]]
name = "pre-release"
stores = ["prefix-dev", "branch"]

# The scope a disconnected host restores from, and the ref its entrypoint clones.
#
# `branch`/`commit` name the ref `universe airlock publish-bootstrap` writes: an executable
# `universe-airlock-bootstrap` at its root plus a descriptor that records the digest it was
# published under. That ref is not the channel — a Conda package is installed by a solver, while
# this entrypoint `exec`s a file out of a checkout — and it is stable rather than per-build: the
# publish leaves the commit alone when the binary has not changed, so the pin below only moves
# when the bootstrapper does, and `pixi run airlock-check` fails until it is re-rendered.
#
# The ref is advanced *after* the artifacts it restores (`doc-103`): a bootstrap that pointed at
# an incomplete publication would be worse than no pin at all.
[airlock.developer]

[airlock.developer.restore]
remote = "https://github.com/Archont561/universe.git"
# Namespaced for the same reason the channel's ref is: a bare `bootstrap` at the repository root
# claims a name every project in this namespace would want.
branch = "universe/bootstrap"
commit = "7c402a800b9d33aa6aec1e8445a4e985658e97cc"

# The scope that ships a payload, and the reason `universe airlock pack` has something to pack.
#
# Declared empty on purpose. `adapters` names the lock formats this project can *replay* on the
# target, and nothing replays a lock yet (`UNI-51`, `UNI-52`); `catalog` names a pinned catalog
# someone else published, which this owner lane is not consuming either. What the declaration buys
# today is the payload: `pack` refuses a repository that declares no delivery scope, so writing
# one is how this repository says it ships, and `pixi run airlock-check` keeps the entrypoint and
# this scope in step.
[airlock.delivery]

[workflow]
# These gate `universe-kit`'s `verify --artifact` / `--published` / `--index` verbs, not the
# consumer's `universe-airlock verify` (`UNI-32`). The renderer emits those commands from the
# flags, so leaving them false is the difference between a pipeline that proves less than it
# claims and one that calls a verb nobody has written yet. Flip both only when the producer's
# verify lands; the Airlock consumer verb does not satisfy them.
verify_artifact = false
verify_published = false

# The closed three-slot vocabulary. Each command is one Pixi task, which is what keeps the
# rendered `validate` job free of ad-hoc shell (house rule 10).
[workflow.checks]
format = "pixi run fmt-check"
lint = "pixi run lint"
typecheck = "pixi run typecheck"
